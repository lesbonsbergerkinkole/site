<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Formulaire d'inscription / Contact</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>Vos Informations</h2>
            
            <!-- Formulaire -->
<!-- Formulaire d'inscription / Contact -->
<form action="https://formspree.io/f/mdekdygr" method="POST">

    <div style="margin-bottom: 15px;">
        <label for="name">Nom :</label><br>
        <input type="text" id="name" name="name" required style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="email">E-mail :</label><br>
        <input type="email" id="email" name="email" required style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="message">Message :</label><br>
        <textarea id="message" name="message" rows="4" required style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    </div>

    <button type="submit" style="background-color: #ffd700; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">
        Envoyer
    </button>

</form>
            <br>
            <!-- Bouton pour revenir à la première page -->
            <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Tous droits réservés.</p>
    </footer>

</body>
</html>
